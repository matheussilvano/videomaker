[project]
name = "videomaker"
version = "0.1.0"
description = "Make videos end to end with Claude Code: write, narrate, animate, edit and render, all local and free."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "videomaker contributors" }]
keywords = ["video", "claude-code", "ffmpeg", "playwright", "tts", "motion-graphics", "ai-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "pydantic>=2.7",
  "playwright>=1.45",
  "kokoro-onnx>=0.4",
  "soundfile>=0.12",
  "numpy>=1.26",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]

[project.urls]
Homepage = "https://github.com/matheussilvano/videomaker"
Issues = "https://github.com/matheussilvano/videomaker/issues"

[project.scripts]
videomaker = "videomaker.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videomaker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # ruff format owns line length; ffmpeg argument lists stay readable

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: needs a Chromium/Chrome binary and ffmpeg"]
